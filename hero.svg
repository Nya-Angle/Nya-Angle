<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" fill="none">
  <style>
    .bg { fill: #09090b; }
    .border { stroke: #27272a; stroke-width: 1; }
    .grid { stroke: #18181b; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #fafafa; font-size: 38px; font-weight: 700; letter-spacing: -0.03em; }
    .sub { fill: #a1a1aa; font-size: 13px; letter-spacing: 0.04em; }
    .tag { fill: #71717a; font-size: 11px; letter-spacing: 0.12em; }
    .accent { fill: #38bdf8; }
    .node-line { stroke: #27272a; stroke-width: 1; }
    .pulse-line {
      stroke: url(#grad);
      stroke-width: 1.5;
      stroke-dasharray: 90 420;
      animation: flow 5s linear infinite;
    }
    .blink { animation: pulse 2.4s ease-in-out infinite; }
    .cursor { animation: blink 1.1s step-end infinite; }

    @keyframes flow {
      0% { stroke-dashoffset: 510; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="smallGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="900" height="260" rx="12" class="bg"/>
  <rect width="900" height="260" rx="12" fill="url(#smallGrid)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="11.5" class="border"/>

  <!-- Top Telemetry Bar -->
  <circle cx="32" cy="30" r="3.5" class="accent blink"/>
  <text x="46" y="34" class="mono tag">SYS.ONLINE // MANHATTAN, NY</text>
  <text x="868" y="34" text-anchor="end" class="mono tag">PORTAL: GETSTH.TODAY</text>
  <line x1="24" y1="52" x2="876" y2="52" class="node-line"/>
  <line x1="24" y1="52" x2="876" y2="52" class="pulse-line"/>

  <!-- Main Identity -->
  <text x="32" y="122" class="sans title">Angle CC</text>
  <text x="208" y="122" class="mono" fill="#52525b" font-size="22" font-weight="500">@Nya-Angle</text>
  <rect x="352" y="101" width="9" height="22" fill="#38bdf8" class="cursor"/>

  <text x="32" y="156" class="sans sub">Architecting local-first desktop AI agents, reflective memory systems, and interactive LLM tutoring.</text>

  <!-- Bottom Architecture Nodes -->
  <line x1="24" y1="196" x2="876" y2="196" class="node-line"/>

  <g transform="translate(32, 226)">
    <text x="0" y="0" class="mono tag">STACK</text>
    <text x="64" y="0" class="mono" fill="#e4e4e7" font-size="12">AXTree · MultiHop-RAG · Long-Term Memory · MCP · WebGPU</text>
    <text x="836" y="0" text-anchor="end" class="mono tag" fill="#38bdf8">[ LOCAL-FIRST ]</text>
  </g>
</svg>
